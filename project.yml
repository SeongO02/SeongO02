name: RAWEditor
options:
  bundleIdPrefix: com.seongo02
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  RAWEditor:
    type: application
    platform: iOS
    sources:
      - RAWEditor
    info:
      path: RAWEditor/Info.plist
      properties:
        CFBundleDisplayName: RAW Editor
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: RAW 사진을 불러오기 위해 사진 보관함에 접근합니다.
        NSPhotoLibraryAddUsageDescription: 편집한 사진을 사진 보관함에 저장합니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seongo02.raweditor
